name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 13 * * *'  # runs daily at 1pm UTC — no need to touch this
  workflow_dispatch:        # lets you also trigger it manually from GitHub if you ever want to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -s -o /dev/null -w "Ping sent, response code: %{http_code}\n" \
            "https://jtljqmcdmdenfvxktnty.supabase.co/rest/v1/expenses?select=id&limit=1" \
            -H "apikey: sb_publishable_MOH2ra7M8iMuxmty7dWngQ_2a9a02Es" \
            -H "Authorization: Bearer sb_publishable_MOH2ra7M8iMuxmty7dWngQ_2a9a02Es"
